<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="FraudShield AI - Enterprise Fraud Operations Console">
<title>FraudShield AI - Fraud Operations Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root {
  --bg: #0B1113;
  --card: #111B1F;
  --surface-2: #162328;
  --line: #24363B;
  --brand: #39B9AB;
  --ink: #F3F7F7;
  --mute: #8EA3A8;
  --hi: #FF7773;
  --me: #F2B84B;
  --lo: #45C486;
  --hib: rgba(255, 119, 115, 0.12);
  --meb: rgba(242, 184, 75, 0.12);
  --lob: rgba(69, 196, 134, 0.12);
  --brand-b: rgba(57, 185, 171, 0.12);
  box-sizing: border-box;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background-color: var(--bg);
  background-attachment: fixed;
  background-repeat: no-repeat;
  background-size: cover;
  color: var(--ink);
  font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
  transition: background-image 300ms ease, background-position 300ms ease;
  min-height: 100vh;
}

/* 1. LOGIN PAGE (Top-Left Quadrant: Cyber-security Shield & Network Nodes) */
body.page-login {
  background-image:
    linear-gradient(
      135deg,
      rgba(7, 16, 19, 0.55) 0%,
      rgba(7, 16, 19, 0.78) 100%
    ),
    url('./bg-login.png');
  background-position: right 10% center;
  background-size: cover;
}

/* 2. OVERVIEW / DASHBOARD PAGE (Top-Right Quadrant: Data Graph & Perspective Grid) */
body.page-ov {
  background-image:
    linear-gradient(
      180deg,
      rgba(7, 16, 19, 0.78) 0%,
      rgba(7, 16, 19, 0.86) 100%
    ),
    url('./bg-overview.png');
  background-position: center bottom;
  background-size: cover;
}

/* 3. CASE QUEUE / FRAUD CASES PAGE (Bottom-Left Quadrant: Circuit Board Pattern) */
body.page-queue {
  background-image:
    linear-gradient(
      180deg,
      rgba(7, 16, 19, 0.84) 0%,
      rgba(7, 16, 19, 0.90) 100%
    ),
    url('./bg-cases.png');
  background-position: center center;
  background-size: cover;
}

/* 4. SCAM INTELLIGENCE, RULES & MODELS, PAYMENTS (Bottom-Right Quadrant: Radar & Threat Visualization) */
body.page-scam,
body.page-rules,
body.page-tx {
  background-image:
    linear-gradient(
      135deg,
      rgba(7, 16, 19, 0.72) 0%,
      rgba(7, 16, 19, 0.84) 100%
    ),
    url('./bg-radar.png');
  background-position: right 15% bottom 15%;
  background-size: cover;
}

button, input, select, textarea {
  font-family: inherit;
  font-size: 14px;
  color: var(--ink);
}
button { cursor: pointer; }
:focus-visible {
  outline: 2px solid var(--brand);
  outline-offset: 2px;
}

/* Layout */
.app {
  display: grid;
  grid-template-columns: 240px 1fr;
  min-height: 100vh;
}

/* Sidebar */
nav {
  background: rgba(9, 14, 16, 0.92);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-right: 1px solid var(--line);
  padding: 24px 16px;
  position: sticky;
  top: 0;
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  z-index: 20;
}

.brand {
  margin-bottom: 24px;
}
.brand-title {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 18px;
  font-weight: 700;
  color: var(--ink);
  letter-spacing: -0.3px;
}
.brand-title svg { width: 22px; height: 22px; color: var(--brand); }
.brand-subtitle {
  font-size: 12px;
  color: var(--mute);
  margin-top: 2px;
  font-weight: 500;
}

.nav-links {
  display: flex;
  flex-direction: column;
  gap: 4px;
  flex-grow: 1;
}

nav a {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 9px 12px;
  border-radius: 6px;
  color: var(--mute);
  text-decoration: none;
  font-size: 13.5px;
  font-weight: 500;
  transition: all 150ms ease;
}
nav a:hover {
  background: var(--surface-2);
  color: var(--ink);
}
nav a.on {
  background: var(--surface-2);
  color: var(--brand);
  font-weight: 600;
  border-left: 3px solid var(--brand);
  border-top-left-radius: 2px;
  border-bottom-left-radius: 2px;
}
nav a .nav-item-inner {
  display: flex;
  align-items: center;
  gap: 10px;
}
nav a svg { width: 16px; height: 16px; opacity: 0.85; }
nav a.on svg { opacity: 1; color: var(--brand); }

nav a span.badge {
  background: var(--hi);
  color: #000;
  font-size: 11px;
  padding: 1px 7px;
  border-radius: 99px;
  font-weight: 700;
}

.nav-footer {
  padding-top: 16px;
  border-top: 1px solid var(--line);
  font-size: 12px;
  color: var(--mute);
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.status-indicator {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  font-weight: 600;
  color: var(--lo);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.status-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--lo);
  box-shadow: 0 0 6px var(--lo);
}

/* Header & Main Content */
main {
  padding: 24px 32px;
  max-width: 1280px;
  width: 100%;
}

header.top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  margin-bottom: 24px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--line);
  flex-wrap: wrap;
}

.breadcrumb {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: var(--mute);
}
.breadcrumb span.current {
  color: var(--ink);
  font-weight: 600;
}

.top-bar h2 {
  margin: 4px 0 0 0;
  font-size: 26px;
  font-weight: 700;
  letter-spacing: -0.4px;
}

.user-profile {
  display: flex;
  align-items: center;
  gap: 12px;
}
.user-badge {
  background: var(--card);
  border: 1px solid var(--line);
  padding: 6px 12px;
  border-radius: 6px;
  font-size: 13px;
  font-weight: 600;
  color: var(--ink);
  display: flex;
  align-items: center;
  gap: 8px;
}
.user-badge svg { width: 15px; height: 15px; color: var(--brand); }

/* Buttons */
.btn {
  background: var(--brand);
  color: #071715;
  border: 0;
  border-radius: 6px;
  padding: 8px 16px;
  font-weight: 600;
  font-size: 13px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: all 150ms ease;
}
.btn:hover { opacity: 0.92; transform: translateY(-1px); }
.btn:active { transform: translateY(0); }
.btn.alt {
  background: var(--surface-2);
  color: var(--ink);
  border: 1px solid var(--line);
}
.btn.alt:hover {
  border-color: var(--brand);
  color: var(--brand);
}
.btn.bad { background: var(--hi); color: #160404; }
.btn.good { background: var(--lo); color: #04160c; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

/* Grid & Cards */
.grid { display: grid; gap: 16px; }
.gs { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.g2 { grid-template-columns: 1fr 1fr; }
.g3 { grid-template-columns: 2fr 1fr; }

.card {
  background: rgba(17, 27, 31, 0.90);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 20px;
  min-width: 0;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
}
.card-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 14px;
}
.card h3 {
  margin: 0;
  font-size: 16px;
  font-weight: 600;
  color: var(--ink);
}

.stat small { display: block; color: var(--mute); font-size: 12px; margin-bottom: 6px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.4px; }
.stat b { display: block; font-size: 28px; font-weight: 700; color: var(--ink); letter-spacing: -0.5px; }
.stat .context-line { display: block; font-size: 12px; color: var(--mute); margin-top: 6px; font-weight: 400; }

/* Risk Badges */
.pill {
  display: inline-flex;
  align-items: center;
  padding: 3px 10px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 700;
  border: 1px solid;
  text-transform: uppercase;
  letter-spacing: 0.4px;
}
.Low { background: var(--lob); color: var(--lo); border-color: rgba(69, 196, 134, 0.4); }
.Medium { background: var(--meb); color: var(--me); border-color: rgba(242, 184, 75, 0.4); }
.High { background: var(--hib); color: var(--hi); border-color: rgba(255, 119, 115, 0.4); }

.chip {
  display: inline-block;
  font-size: 11.5px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 2px 7px;
  margin: 2px 4px 2px 0;
  color: var(--mute);
  font-weight: 500;
}

/* Data Tables */
.wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th, td {
  text-align: left;
  padding: 12px 14px;
  border-bottom: 1px solid var(--line);
  white-space: nowrap;
}
th { color: var(--mute); font-weight: 600; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.5px; background: rgba(0,0,0,0.15); }
tr.row { cursor: pointer; transition: background 150ms ease; }
tr.row:hover { background: var(--surface-2); }
tr.new { animation: flashNew 2s ease-out; }
@keyframes flashNew {
  0% { background: var(--hib); }
  100% { background: transparent; }
}

/* Inputs & Form Controls */
.tools { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; align-items: center; }
input, select, textarea {
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 9px 12px;
  color: var(--ink);
  outline: none;
  transition: border-color 150ms ease;
}
input:focus, select:focus, textarea:focus {
  border-color: var(--brand);
}
textarea { width: 100%; min-height: 90px; resize: vertical; }

.search-box {
  position: relative;
  display: inline-flex;
  align-items: center;
}
.search-box input {
  padding-left: 34px;
  min-width: 220px;
}
.search-box svg {
  position: absolute;
  left: 10px;
  width: 15px;
  height: 15px;
  color: var(--mute);
  pointer-events: none;
}

/* Modals */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(4, 7, 8, 0.85);
  backdrop-filter: blur(4px);
  display: grid;
  place-items: center;
  padding: 20px;
  z-index: 100;
}
.modal .card {
  max-width: 820px;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
  border: 1px solid var(--line);
  box-shadow: 0 16px 36px rgba(0,0,0,0.6);
}

.bar { display: flex; align-items: center; gap: 10px; font-size: 12.5px; margin: 8px 0; }
.bar i { display: block; height: 10px; border-radius: 2px; background: var(--brand); transition: width 200ms ease; }
.bar span:first-child { width: 190px; color: var(--mute); text-overflow: ellipsis; overflow: hidden; white-space: nowrap; }

dl { display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; margin: 0; font-size: 13px; }
dt { color: var(--mute); font-weight: 500; }
dd { margin: 0; font-weight: 600; color: var(--ink); }

.log { font-size: 12.5px; color: var(--mute); margin: 8px 0 16px 0; padding-left: 18px; }
.log li { margin-bottom: 4px; }

/* Login Page */
.login-container { max-width: 420px; margin: 10vh auto; padding: 0 16px; }
.login-card {
  display: flex;
  flex-direction: column;
  gap: 16px;
  text-align: left;
  background: rgba(17, 27, 31, 0.94);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 28px;
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6), 0 0 1px rgba(57, 185, 171, 0.3);
}
.login-header { text-align: center; margin-bottom: 8px; }
.login-header h1 { font-size: 24px; font-weight: 700; margin: 0 0 4px 0; color: var(--ink); }
.login-header p { font-size: 13px; color: var(--mute); margin: 0; }
.form-group { display: flex; flex-direction: column; gap: 6px; }
.form-group label { font-size: 12px; font-weight: 600; color: var(--mute); text-transform: uppercase; letter-spacing: 0.4px; }
.password-field { position: relative; display: flex; align-items: center; }
.password-field input { width: 100%; padding-right: 36px; }
.password-toggle { position: absolute; right: 10px; background: none; border: none; color: var(--mute); padding: 4px; display: flex; }
.password-toggle:hover { color: var(--ink); }

/* Toasts */
.toast {
  position: fixed;
  right: 24px;
  bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  background: var(--card);
  border: 1px solid var(--brand);
  color: var(--ink);
  padding: 12px 18px;
  border-radius: 6px;
  z-index: 200;
  box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  font-weight: 500;
  font-size: 13.5px;
  display: flex;
  align-items: center;
  gap: 10px;
  animation: slideUp 200ms ease-out;
}
@keyframes slideUp {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

.menu-btn { display: none; }
@media (max-width: 880px) {
  .app { grid-template-columns: 1fr; }
  nav { position: static; height: auto; display: none; border-right: none; border-bottom: 1px solid var(--line); }
  nav.open { display: flex; }
  .menu-btn { display: inline-flex; }
  .g2, .g3 { grid-template-columns: 1fr; }
  main { padding: 18px; }
  .bar span:first-child { width: 130px; }
}
</style>
</head>

const $ = s => document.querySelector(s);
const fmt = n => '₹' + Math.round(n).toLocaleString('en-IN');

// 5 Deterministic Fraud Detection Rules & Specifications
const FL = {
  large_amount_new_payee: ['Large payment to new payee', 'Over ₹50,000 to a payee this customer has never paid before.', 92],

  hi: 0.8,

const score = (f, p) => p >= S.hi || f.length >= 2 ? 'High' : (p >= 0.5 || f.length === 1 ? 'Medium' : 'Low');

function rules(t, h) {
  const f = [];
  const seen = h.some(x => x.payee === t.payee);

  return f.filter(x => !S.off.has(x));
}

function mk(o = {}) {

    cid: Math.floor(rnd() * 6),

  t.ml = o.ml ?? Math.min(0.99, +(Math.min(0.25, t.amount / 4e5) + t.f.length * 0.28 + rnd() * 0.12).toFixed(2));

  t.status = t.risk === 'Low' ? 'cleared' : 'open';
  S.log[t.id] = [[t.timestamp, 'System', `Screened: ${t.risk} risk (model ${t.ml})`]];
  return t;
}

  [1, 36000, 'QR', 'shop.qr4410@icici', ['new_qr_merchant_high_value'], 0.62, 22],
  [2, 90, 'UPI', 'kyc.help7@ybl', ['rapid_micro_transactions'], 0.55, 9],
  [5, 48000, 'UPI', 'night.pay@paytm', ['odd_hour_transaction'], 0.66, 40]
].forEach(([c, a, ch, p, f, ml, m]) => {
  const t = mk({ cid: c, amount: a, channel: ch, payee: p, timestamp: ago(m), ml });
  t.f = f;
  t.risk = score(f, ml);
  t.status = 'open';
  S.log[t.id] = [[t.timestamp, 'System', `Screened: ${t.risk} risk (model ${ml})`]];
  S.tx.unshift(t);
});

S.tx.sort((a, b) => b.timestamp < a.timestamp ? -1 : 1);

const badge = l => `<span class="pill ${l}">${l}</span>`;
const chips = f => f.map(x => `<span class="chip" title="${FL[x]?.[1] || ''}">${FL[x]?.[0] || x}</span>`).join('');

const mins = t => Math.round((Date.now() - new Date(t.timestamp)) / 6e4);
const left = t => (t.risk === 'High' ? 15 : 60) - mins(t);
const sla = t => ['open', 'held', 'escalated'].includes(t.status) && t.risk !== 'Low' 
  ? (left(t) >= 0 ? `${left(t)}m left` : `<b style="color:var(--hi)">overdue ${-left(t)}m</b>`) 
  : '-';

function toast(m) {
  const e = document.createElement('div');
  e.className = 'toast';
  e.innerHTML = `<svg style="width:16px;height:16px;color:var(--brand)"><use href="#icon-shield"/></svg> <span>${m}</span>`;
  document.body.append(e);
  setTimeout(() => e.remove(), 2800);
}

function explain(t) {
  const f = t.f;
  const n = x => f.includes(x);
  return [
    ['Amount vs avg spend', t.amount > cu(t).m / 3 ? 0.34 : -0.12],
    ['Payee is new', (n('large_amount_new_payee') || n('new_qr_merchant_high_value')) ? 0.28 : -0.1],
    ['Hour of day', n('odd_hour_transaction') ? 0.22 : -0.06],
    ['Days since last payment', n('burst_after_dormancy') ? 0.31 : -0.04],
    ['Channel: ' + t.channel, t.channel === 'QR' ? 0.09 : -0.05],
    ['Recent payment count', n('rapid_micro_transactions') ? 0.30 : -0.08]
  ].sort((a, b) => Math.abs(b[1]) - Math.abs(a[1]));
}

function act(i, a) {
  const t = S.tx.find(x => x.id == i);
  const n = $('#nt').value.trim();
  if (!n) return toast('Add a decision note before recording action.');

  let note = n;
  if (S.u.role === 'analyst' && t.amount > 50000 && (a === 'blocked' || a === 'fraud')) {
    note = `Requested "${ST[a]}". ${n}`;
    a = 'escalated';
    toast('Sent to supervisor for authorization (Amount > ₹50,000)');
  } else {
    toast(`Case status updated: ${ST[a]}`);
  }

  t.status = a;
  S.log[i].push([new Date().toISOString(), S.u.name, `${ST[a]}. ${note}`]);
  document.querySelector('.modal')?.remove();
  go();
}

async function addTx() {
  const a = +$('#a').value;
  const p = $('#p').value.trim();
  if (!a || !p) return toast('Enter a valid amount and payee handle.');

  let ts = new Date();
  if ($('#h').value === '3') ts.setHours(3, 0, 0, 0);

  try {
    const res = await fetch('/api/transactions/screen', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        amount: a,
        type: 'transfer',
        channel: $('#ch').value,
        payee_id: p,
        timestamp: ts.toISOString()
      })
    });
    if (res.ok) {
      const apiTxn = await res.json();
      toast(`API Screened: ${apiTxn.risk_level} risk (${apiTxn.rule_flags.length} rules)`);
    }
  } catch (err) {}

  const t = mk({
    cid: +$('#c').value,
    amount: a,
    channel: $('#ch').value,
    payee: p,
    timestamp: ts.toISOString()
  });

  S.tx.unshift(t);
  toast(`${t.risk} Risk score assigned` + (t.f.length ? ` (${t.f.length} rule flags matched)` : ''));
  go();
}

V.scam = () => `
<div class="card">

  </p>

  <textarea id="sm" placeholder="Paste suspected message here (e.g. 'URGENT: Your account is blocked due to missing KYC. Click link immediately or transfer funds to avoid arrest...')" style="font-size:14px;margin-bottom:14px"></textarea>

  <div class="tools">
    <button class="btn" onclick="checkScam()">🔍 Analyze Message Content</button>
  </div>

  <div id="sr" style="margin-top:18px"></div>
</div>`;

async function checkScam() {
  const m = $('#sm').value.trim();
  if (!m) return toast('Paste message content to analyze.');

  try {
    const res = await fetch('/api/scam-desk/analyze', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: m })
    });
    if (res.ok) {
      const data = await res.json();
      $('#sr').innerHTML = `
        <div style="background:var(--surface-2);padding:18px;border-radius:6px;border:1px solid var(--line)">
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
            ${badge(data.risk_level)}
            <b style="font-size:16px">${data.title}</b>
          </div>
          <p style="margin:0 0 8px 0">${data.explanation}</p>
          ${data.matched_keywords.length ? `<small style="color:var(--mute)">Matched Risk Indicators: ${data.matched_keywords.join(', ')}</small>` : ''}
        </div>`;
      return;
    }
  } catch (e) {}

  const lower = m.toLowerCase();
  const k = ['otp', 'pin', 'cvv', 'digital arrest', 'cbi', 'police', 'urgent', 'immediately', 'blocked', 'kyc', 'click', 'collect request', 'transfer'].filter(x => lower.includes(x));
  const v = k.length >= 3 
    ? ['High', 'Likely Phishing / Digital Arrest Scam', 'Pressures customer to act urgently and requests sensitive credentials or transfer under threat.']
    : (k.length ? ['Medium', 'Suspicious - Caution Advised', 'Contains phrases common in phishing attempts. Advise customer to verify via official app.'] : ['Low', 'Likely Safe', 'No standard scam indicator patterns identified.']);

  $('#sr').innerHTML = `
    <div style="background:var(--surface-2);padding:18px;border-radius:6px;border:1px solid var(--line)">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
        ${badge(v[0])}
        <b style="font-size:16px">${v[1]}</b>
      </div>
      <p style="margin:0 0 8px 0">${v[2]}</p>
    </div>`;
}
